<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sanjit General Store</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f5f7fa;color:#222}
header{background:#146c43;color:#fff;text-align:center;padding:20px;position:sticky;top:0;z-index:5}
header h1{margin:0 0 5px}.container{max-width:1150px;margin:auto;padding:16px}
.search{width:100%;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:16px}
.categories{display:flex;gap:8px;overflow:auto;padding:14px 0}
.cat{white-space:nowrap;border:1px solid #ddd;background:#fff;border-radius:22px;padding:10px 15px}
.cat.active{background:#146c43;color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card,.panel{background:#fff;border-radius:12px;padding:15px;box-shadow:0 2px 9px #0001}
.card h3{margin:0 0 7px}.size{color:#666;font-size:14px}.price{color:#146c43;font-weight:bold;font-size:18px;margin:10px 0}
.add,.order,.clear{width:100%;border:0;border-radius:8px;padding:11px;font-weight:bold}.add{background:#146c43;color:#fff}
.cart{position:fixed;right:16px;bottom:16px;background:#ff8c00;color:#fff;border:0;padding:14px 18px;border-radius:30px;z-index:10}
.panel{display:none;margin-top:20px}.row{display:flex;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}
.qty button{border:0;padding:5px 9px}.qty span{padding:0 8px}input{width:100%;padding:11px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
.order{background:#25d366;color:#fff;margin-top:8px}.clear{background:#eee;margin-top:8px}
.payment-box{margin-top:16px;padding:15px;border:1px solid #ddd;border-radius:12px;background:#f9fbfa}
.payment-title{font-size:18px;font-weight:bold;margin-bottom:10px}
.pay-option{display:flex;gap:8px;align-items:center;margin:9px 0}
.qr-wrap{text-align:center;margin:12px 0}
.qr-wrap img{width:min(280px,100%);border-radius:10px;border:1px solid #ddd;background:#fff;padding:8px}
.upi-id{font-weight:bold;margin:8px 0}
.pay-note{font-size:13px;color:#666;line-height:1.45}
.pay-btn{display:block;width:100%;border:0;border-radius:8px;padding:11px;font-weight:bold;background:#146c43;color:#fff;margin-top:8px}
.note{text-align:center;color:#666;font-size:13px}
</style></head>
<body>
<header><h1>🛒 Sanjit General Store</h1><div>Daily Needs • Snacks • Biscuits • Beverages</div></header>
<div class="container">
<input id="search" class="search" placeholder="🔍 Search product..." oninput="render()">
<div id="categories" class="categories"></div>
<div id="products" class="grid"></div>
<div id="cartPanel" class="panel"><h2>🛒 Your Cart</h2><div id="cartItems"></div><h3 id="total">Total: ₹0.00</h3>
<input id="customer" placeholder="Customer Name"><input id="mobile" placeholder="Mobile Number" type="tel">

<div class="payment-box">
  <div class="payment-title">💳 Payment Method</div>
  <label class="pay-option"><input type="radio" name="payment" value="online" checked onchange="togglePayment()"> Pay Online (UPI Scanner)</label>
  <label class="pay-option"><input type="radio" name="payment" value="cod" onchange="togglePayment()"> UPI on Delivery</label>

  <div id="onlinePayment">
    <div class="qr-wrap">
      <img src="assets/upi-qr.png" alt="Sanjit General Store UPI QR Scanner">
      <div class="upi-id">UPI ID: Q673525302@ybl</div>
      <div class="pay-note">Scan the QR code with any UPI app and pay the order amount shown above.</div>
    </div>
    <label class="pay-option"><input type="checkbox" id="paidConfirm"> I have completed the UPI payment</label>
  </div>
</div>

<button class="order" onclick="sendWhatsApp()">📲 Order on WhatsApp</button><button class="clear" onclick="clearCart()">Clear Cart</button></div>
<p class="note">All prices are as per MRP.</p></div>
<button class="cart" onclick="toggleCart()">🛒 Cart (<span id="count">0</span>)</button>
<script>
const products=[
["Kur Kure","",10,"Snacks & Namkeen"],["Kur Kure","",20,"Snacks & Namkeen"],["Khatta Meetha","",10,"Snacks & Namkeen"],["Khatta Meetha","",20,"Snacks & Namkeen"],["Bhujia","",10,"Snacks & Namkeen"],["Bhujia","",20,"Snacks & Namkeen"],["Aalu Bhujia","",20,"Snacks & Namkeen"],["Moong Dal","",20,"Snacks & Namkeen"],["Navrattan Mixture","",10,"Snacks & Namkeen"],["Navrattan Mixture","",20,"Snacks & Namkeen"],["All in One Mixture","",10,"Snacks & Namkeen"],["Corn Mixture","",10,"Snacks & Namkeen"],["Little Hearts","",5,"Biscuits & Bakery"],["Lays","",10,"Snacks & Namkeen"],["Bourbon Biscuit","",10,"Biscuits & Bakery"],["Oreo Biscuit","",10,"Biscuits & Bakery"],["Bounce Choco Crème","",10,"Biscuits & Bakery"],["Mom's Magic","",10,"Biscuits & Bakery"],["Cadbury Cookies","",30,"Biscuits & Bakery"],["Lotte Choco Pie","",10,"Biscuits & Bakery"],["Cake Gobbles","",10,"Biscuits & Bakery"],["HR Soan Papdi","",90,"Sweets"],["HR Soan Papdi","",165,"Sweets"],["5 Star","",20,"Chocolates"],["Dairy Milk","",20,"Chocolates"],["Kit Kat","",25,"Chocolates"],["Sprite","2 Ltr",100,"Cold Drinks & Beverages"],["Sprite","1 Ltr",50,"Cold Drinks & Beverages"],["Sprite","750 ml",50,"Cold Drinks & Beverages"],["Sprite","250 ml",20,"Cold Drinks & Beverages"],["Thums Up","2 Ltr",90,"Cold Drinks & Beverages"],["Thums Up","1 Ltr",50,"Cold Drinks & Beverages"],["Thums Up","750 ml",40,"Cold Drinks & Beverages"],["Thums Up","250 ml",20,"Cold Drinks & Beverages"],["Cock","400 ml",20,"Cold Drinks & Beverages"],["Maaza","600 ml",40,"Cold Drinks & Beverages"],["Maaza","125 ml",10,"Cold Drinks & Beverages"],["Hell","250 ml",60,"Cold Drinks & Beverages"],["Campa Energy","185 ml",30,"Cold Drinks & Beverages"],["Sting Energy","250 ml",20,"Cold Drinks & Beverages"],["Limca","250 ml",20,"Cold Drinks & Beverages"],["Lahori Zeera","160 ml",10,"Cold Drinks & Beverages"],["Bisleri","500 ml",10,"Water"],["Nihar Hair Oil","99 ml",43,"Personal Care"],["Sensodyne Tooth Paste","",20,"Personal Care"],["Sensodyne Tooth Brush","",31,"Personal Care"],["Sensodyne Tooth Brush","",62,"Personal Care"],["Maggi","",90,"Instant Food"],["Maggi","",60,"Instant Food"],["Maggi","",15,"Instant Food"]];
const cats=["All","Snacks & Namkeen","Biscuits & Bakery","Chocolates","Cold Drinks & Beverages","Water","Personal Care","Instant Food","Sweets"];
let selected="All",cart=[];
function renderCats(){categories.innerHTML=cats.map(c=>`<button class="cat ${selected==c?'active':''}" onclick="selected='${c}';renderCats();render()">${c}</button>`).join("")}
function render(){let q=search.value.toLowerCase();productsDiv=products;productsDiv=[];products.forEach((p,i)=>{if((selected=="All"||p[3]==selected)&&(p[0]+" "+p[1]).toLowerCase().includes(q))productsDiv.push(i)});productsEl.innerHTML=productsDiv.map(i=>{let p=products[i];return `<div class="card"><h3>${p[0]}</h3><div class="size">${p[1]||"Pack"}</div><div class="price">₹${p[2].toFixed(2)} <small>(As per MRP)</small></div><button class="add" onclick="add(${i})">Add to Cart</button></div>`}).join("")||"<p>No products found.</p>"}
function add(i){cart.push(i);update()}function remove(i){let x=cart.indexOf(i);if(x>=0)cart.splice(x,1);update()}
function update(){let c={},t=0;cart.forEach(i=>c[i]=(c[i]||0)+1);cartItems.innerHTML=Object.keys(c).map(k=>{let i=+k,p=products[i],n=c[i],a=p[2]*n;t+=a;return `<div class="row"><div><b>${p[0]}</b><br><small>${p[1]||"Pack"} • ₹${p[2]}</small></div><div class="qty"><button onclick="remove(${i})">−</button><span>${n}</span><button onclick="add(${i})">+</button></div></div>`}).join("")||"<p>Cart is empty.</p>";total.textContent="Total: ₹"+t.toFixed(2);count.textContent=cart.length}
function toggleCart(){cartPanel.style.display=cartPanel.style.display=="block"?"none":"block";update()}function clearCart(){cart=[];update()}
function togglePayment(){
  const online=document.querySelector('input[name="payment"][value="online"]').checked;
  document.getElementById("onlinePayment").style.display=online?"block":"none";
}
function sendWhatsApp(){
  if(!cart.length)return alert("Please add items to cart.");
  let c={},t=0,n=1;
  cart.forEach(i=>c[i]=(c[i]||0)+1);
  let name=customer.value||"Customer",mob=mobile.value||"-";
  let online=document.querySelector('input[name="payment"][value="online"]').checked;
  let paid=online && document.getElementById("paidConfirm").checked;
  if(online && !paid){
    if(!confirm("Please complete the UPI payment using the scanner, then click OK to continue.")) return;
  }
  let paymentText=online ? (paid ? "Online UPI - Customer marked payment completed" : "Online UPI - Payment status not confirmed") : "UPI on Delivery";
  let m=`*Sanjit General Store - Order*%0A%0ACustomer: ${encodeURIComponent(name)}%0AMobile: ${encodeURIComponent(mob)}%0APayment: ${encodeURIComponent(paymentText)}%0A%0A`;
  Object.keys(c).forEach(k=>{
    let i=+k,p=products[i],q=c[i],a=p[2]*q;
    t+=a;
    m+=`${n++}. ${encodeURIComponent(p[0])} ${p[1]?"("+encodeURIComponent(p[1])+") ":""}x ${q} = ₹${a.toFixed(2)}%0A`;
  });
  m+=`%0A*Total: ₹${t.toFixed(2)}*%0AAll prices as per MRP.`;
  window.open("https://wa.me/919006090608?text="+m,"_blank");
}
const categories=document.getElementById("categories"),productsEl=document.getElementById("products"),search=document.getElementById("search"),cartPanel=document.getElementById("cartPanel"),cartItems=document.getElementById("cartItems"),total=document.getElementById("total"),count=document.getElementById("count");renderCats();render();update();
</script></body></html>
